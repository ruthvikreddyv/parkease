<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up · ParkEase</title><link rel="icon" href="/mark.svg"><link rel="stylesheet" href="/style.css"><script defer src="/account.js"></script></head><body><header><a class="brand" href="/"><img src="/mark.svg" alt="">ParkEase</a><a href="/">Parking overview</a></header><main class="panel account"><h1>Sign up</h1><p>Use your driver account to reserve a parking bay.</p>
<form data-mode="signup"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[a-zA-Z0-9_.\-]+" required>
